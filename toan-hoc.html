<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán Học - Rèn Luyện Tư Duy Trẻ Em</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .math-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .level-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .level-btn.active {
            background: linear-gradient(135deg, var(--primary-color), #FF8E8E);
            color: white;
            transform: scale(1.1);
        }

        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .exercise-area {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .question {
            font-size: 3rem;
            color: var(--text-color);
            margin-bottom: 2rem;
            font-weight: bold;
        }

        .visual-aids {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .visual-item {
            font-size: 3rem;
            animation: bounce 1s ease;
        }

        .answer-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .answer-btn {
            padding: 1.5rem;
            font-size: 2rem;
            font-weight: bold;
            border: 3px solid var(--secondary-color);
            border-radius: 15px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .answer-btn:hover {
            background: var(--secondary-color);
            color: white;
            transform: scale(1.1);
        }

        .answer-btn.correct {
            background: var(--success-color);
            border-color: var(--success-color);
            animation: success 0.5s ease;
        }

        .answer-btn.wrong {
            background: var(--primary-color);
            border-color: var(--primary-color);
            animation: shake 0.5s ease;
        }

        .score-display {
            background: linear-gradient(135deg, var(--accent-color), #FFD93D);
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .next-btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--secondary-color), #6FD9D1);
            color: white;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--success-color), var(--secondary-color));
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Học Vui Cùng Bé</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">🏠 Trang Chủ</a></li>
                <li><a href="toan-hoc.html" class="nav-link active">🔢 Toán Học</a></li>
                <li><a href="tieng-viet.html" class="nav-link">📚 Tiếng Việt</a></li>
                <li><a href="tro-choi.html" class="nav-link">🎮 Trò Chơi</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="math-container">
            <h1 class="section-title">🔢 Toán Học Vui Vẻ</h1>
            
            <div class="level-selector">
                <button class="level-btn active" data-level="counting">Đếm Số (4-5 tuổi)</button>
                <button class="level-btn" data-level="addition">Cộng (5-6 tuổi)</button>
                <button class="level-btn" data-level="subtraction">Trừ (6-7 tuổi)</button>
                <button class="level-btn" data-level="mixed">Trộn Lẫn (7+ tuổi)</button>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="score-display">
                ⭐ Điểm: <span id="scoreValue">0</span> / <span id="totalQuestions">0</span>
            </div>

            <div class="exercise-area" id="exerciseArea">
                <div class="question" id="question">Sẵn sàng học toán chưa? 🎯</div>
                <div class="visual-aids" id="visualAids"></div>
                <div class="answer-options" id="answerOptions"></div>
                <button class="next-btn" id="nextBtn" style="display: none;">Câu Tiếp Theo →</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Rèn Luyện Tư Duy Trẻ Em. Học tập vui vẻ mỗi ngày! 🌈</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/math.js"></script>
</body>
</html>
